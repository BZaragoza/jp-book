<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Japonés de N5 a N3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="Libro interactivo de japonés: JLPT N5 a N3">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* Fuentes con buen soporte para kanji y kana */
    body, .markdown-section {
      font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section { max-width: 900px; }
  </style>
</head>
<body>
  <div id="app">Cargando...</div>
  <script>
    window.$docsify = {
      name: 'Japonés N5 → N3',
      basePath: 'docs/',      // Los archivos Markdown viven en docs/
      homepage: 'README.md',
      loadSidebar: false,
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 3,
      relativePath: false,
      search: {
        placeholder: 'Buscar...',
        noData: 'Sin resultados.',
        depth: 3
      }
    };
  </script>
  <!-- Docsify core (tablas y bloques de código vienen soportados por el parser Markdown) -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Búsqueda -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- Resaltado de sintaxis en bloques de código (Prism) -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <!-- Botón de copiar en bloques de código -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
</body>
</html>
